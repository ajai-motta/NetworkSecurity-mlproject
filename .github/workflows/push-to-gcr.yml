name: Build and Push Docker Image to GCR

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'app.py'
      - 'main.py'
      - 'networksecurity/**'
      - '.github/workflows/push-to-gcr.yml'
      
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: latest)'
        required: false
        default: 'latest'

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCR_REGISTRY: gcr.io
  IMAGE_NAME: network-security-model

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker gcr.io

      - name: Generate image metadata
        id: meta
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          GIT_SHA=${{ github.sha }}
          GIT_REF=${{ github.ref_name }}
          
          # Set image tag based on trigger
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG=${{ github.event.inputs.tag }}
          else
            TAG=${GIT_REF}-${GIT_SHA:0:7}-${TIMESTAMP}
          fi
          
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "git_sha=${GIT_SHA:0:7}" >> $GITHUB_OUTPUT
          echo "git_ref=$GIT_REF" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "image=${{ env.GCR_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Load image to Docker daemon
        run: |
          docker load --input /tmp/image.tar

      - name: Push to GCR
        run: |
          docker push ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          docker push ${{ steps.meta.outputs.image }}:latest
          
          echo "Image pushed successfully:"
          echo "  - ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          echo "  - ${{ steps.meta.outputs.image }}:latest"

      - name: Get image digest
        id: image-digest
        run: |
          DIGEST=$(gcloud container images describe ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} \
            --format='get(image_summary.digest)')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Create image summary
        run: |
          echo "## Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: ${{ env.GCR_REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Project**: ${{ env.GCP_PROJECT_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ steps.meta.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ steps.meta.outputs.git_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ steps.meta.outputs.git_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Full Image Path" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Timestamp" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.timestamp }}" >> $GITHUB_STEP_SUMMARY

      - name: Verify image in GCR
        run: |
          echo "Verifying image in GCR..."
          gcloud container images list --project=${{ env.GCP_PROJECT_ID }} --filter="name:${{ env.IMAGE_NAME }}"
          
          echo ""
          echo "Image tags:"
          gcloud container images list-tags \
            ${{ steps.meta.outputs.image }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --limit=5

      - name: Scan image for vulnerabilities (optional)
        continue-on-error: true
        run: |
          gcloud container images scan ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} \
            --project=${{ env.GCP_PROJECT_ID }}

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: failure()
    
    steps:
      - name: Notify failure
        run: |
          echo "Docker image build/push to GCR failed"
          echo "Check the workflow logs for details"
          echo "Image: ${{ env.IMAGE_NAME }}"
