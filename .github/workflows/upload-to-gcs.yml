name: Upload Final Model to GCS

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'final_model/**'
      - '.github/workflows/upload-to-gcs.yml'
  workflow_dispatch:

env:
  GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  upload-to-gcs:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Create timestamp
        id: timestamp
        run: echo "timestamp=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT

      - name: Upload final_model to GCS
        run: |
          gsutil -m cp -r final_model/* gs://${{ secrets.GCS_BUCKET_NAME }}/models/${{ steps.timestamp.outputs.timestamp }}/
          echo "Upload completed successfully to: gs://${{ secrets.GCS_BUCKET_NAME }}/models/${{ steps.timestamp.outputs.timestamp }}/"

      - name: Verify upload
        run: |
          gsutil ls -r gs://${{ secrets.GCS_BUCKET_NAME }}/models/${{ steps.timestamp.outputs.timestamp }}/

      - name: Upload job summary
        run: |
          echo "## Model Upload Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: ${{ steps.timestamp.outputs.timestamp }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bucket**: ${{ secrets.GCS_BUCKET_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Path**: gs://${{ secrets.GCS_BUCKET_NAME }}/models/${{ steps.timestamp.outputs.timestamp }}/" >> $GITHUB_STEP_SUMMARY

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: upload-to-gcs
    if: failure()
    
    steps:
      - name: Notify failure
        run: |
          echo "Model upload to GCS failed"
          echo "Check the workflow logs for details"
