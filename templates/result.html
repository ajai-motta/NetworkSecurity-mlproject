<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Security Prediction Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .container {
            max-width: 1000px;
            margin-top: 30px;
        }
        .card {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: none;
            border-radius: 10px;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px 10px 0 0 !important;
            padding: 20px;
        }
        .card-title {
            margin-bottom: 0;
            font-size: 1.5rem;
            font-weight: 600;
        }
        .prediction-result {
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            margin: 20px 0;
        }
        .prediction-badge {
            font-size: 1.2rem;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 5px;
            display: inline-block;
            margin-top: 10px;
        }
        .badge-safe {
            background-color: #28a745;
            color: white;
        }
        .badge-danger {
            background-color: #dc3545;
            color: white;
        }
        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }
        .back-button {
            margin-top: 20px;
        }
        .table {
            margin-bottom: 0;
        }
        .table thead th {
            background-color: #667eea;
            color: white;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Network Security Prediction Results</h2>
            </div>
            <div class="card-body">
                <!-- Prediction Result Section -->
                <div class="prediction-result">
                    <h4>Prediction Result</h4>
                    {% if pred[0] == 0 %}
                        <p>Status: <span class="prediction-badge badge-safe">✓ SAFE - No Threat Detected</span></p>
                    {% else %}
                        <p>Status: <span class="prediction-badge badge-danger">⚠ THREAT - Anomaly Detected</span></p>
                    {% endif %}
                </div>

                <!-- Data Table Section -->
                <h4>Input Data</h4>
                <div class="table-container">
                    {{ table_html | safe }}
                </div>

                <!-- Back Button -->
                <div class="back-button">
                    <a href="/docs" class="btn btn-primary">
                        <i class="fas fa-arrow-left"></i> Back to Upload
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
